<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Temple Album | Temples Around the World</title>
    <meta name="description" content="A photo album of temples from around the world, with old, new, large, and small temples.">
    <meta name="author" content="Bianca Licursi">
    <link rel="stylesheet" href="styles/temples.css">
    <link rel="stylesheet" href="styles/temples-large.css" media="(min-width: 1000px)">
    <script src="scripts/temples.js" defer></script>
</head>
<body>
    <header>
        <p class="site-title">Temple Album</p>
        <nav>
            <a href="#">Home</a>
            <a href="#">Old</a>
            <a href="#">New</a>
            <a href="#">Large</a>
            <a href="#">Small</a>
        </nav>
    </header>

    <main>
        <h1>Temples Around the World</h1>

        <figure>
            <img src="images/mendoza-argentina-temple.webp" alt="Mendoza Argentina Temple with its gardens" width="400" height="250">
            <figcaption>Mendoza Argentina Temple</figcaption>
        </figure>

        <figure>
            <img src="images/salta-argentina-temple.webp" alt="Salta Argentina Temple" width="400" height="250">
            <figcaption>Salta Argentina Temple</figcaption>
        </figure>

        <figure>
            <img src="images/rome-italy-temple.webp" alt="Rome Italy Temple surrounded by trees" width="400" height="250">
            <figcaption>Rome Italy Temple</figcaption>
        </figure>

        <figure>
            <img src="images/manhattan-new-york-temple.webp" alt="Manhattan New York Temple beside city buildings" width="400" height="250" loading="lazy">
            <figcaption>Manhattan New York Temple</figcaption>
        </figure>

        <figure>
            <img src="images/panama-city-panama-temple.webp" alt="Panama City Panama Temple with palm trees" width="400" height="250" loading="lazy">
            <figcaption>Panama City Panama Temple</figcaption>
        </figure>

        <figure>
            <img src="images/salt-lake-temple.webp" alt="Salt Lake Temple with its granite spires" width="400" height="250" loading="lazy">
            <figcaption>Salt Lake Temple</figcaption>
        </figure>

        <figure>
            <img src="images/kirtland-ohio-temple.webp" alt="Kirtland Ohio Temple with its white tower" width="400" height="250" loading="lazy">
            <figcaption>Kirtland Ohio Temple</figcaption>
        </figure>

        <figure>
            <img src="images/paris-france-temple.webp" alt="Paris France Temple with its gardens" width="400" height="250" loading="lazy">
            <figcaption>Paris France Temple</figcaption>
        </figure>

        <figure>
            <img src="images/los-angeles-california-temple.webp" alt="Los Angeles California Temple, a large white temple" width="400" height="250" loading="lazy">
            <figcaption>Los Angeles California Temple</figcaption>
        </figure>

        <figure>
            <img src="images/monticello-utah-temple.webp" alt="Monticello Utah Temple, a small temple" width="400" height="250" loading="lazy">
            <figcaption>Monticello Utah Temple</figcaption>
        </figure>
    </main>

    <footer>
        <p>&copy; <span id="currentyear"></span> Bianca Licursi</p>
    </footer>
</body>
</html>
